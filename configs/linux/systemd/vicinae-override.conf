# Drop-in override for the packaged vicinae.service.
# Distributed to ~/.config/systemd/user/vicinae.service.d/override.conf
#
# WHY: by default `vicinae server` spawns a Node process (extension-manager.js, ~74MB RSS)
# to host TypeScript/Raycast extensions — even when zero extensions are installed. That node
# runtime is the entire npm supply-chain surface of this launcher. No extensions are used
# here, so the runtime is switched off and the surface goes away with it.
#
# To re-enable extensions later: delete this file (and its repo copy), then
# `systemctl --user daemon-reload && systemctl --user restart vicinae`.
[Service]
ExecStart=
ExecStart=vicinae server --replace --no-extension-runtime
