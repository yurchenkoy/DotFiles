# fuzzel — launcher (Super+Space) and dmenu front-end. man 5 fuzzel.ini.
# Only non-default values are set. Validate edits: fuzzel --dmenu </dev/null
# exits non-zero and names any bad key.
include=~/.config/fuzzel/colors.ini

namespace=fuzzel   # must match the fuzzel-blur layer rule in hyprland.lua

font=CaskaydiaCove Nerd Font Mono:size=12
use-bold=yes
# U+F002 nf-fa-search — a stripped glyph fails silently; restore from here.
prompt="  "
placeholder=Search
terminal=ghostty -e
icon-theme=Adwaita

# Characters and lines, not pixels (~800x400 here).
width=65
lines=15
vertical-pad=16
inner-pad=8

list-executables-in-path=yes   # so ~/.local/bin scripts need no .desktop file
show-actions=yes               # ".. — New Window" as its own entry
filter-desktop=no              # else OnlyShowIn=GNOME apps are hidden

[border]
width=2
radius=12
selection-radius=8

[dmenu]
exit-immediately-if-empty=yes   # don't show an empty window on empty stdin

[key-bindings]
# xremap cannot match a layer-shell surface, so it keeps applying the rules of the
# window focused BEFORE the launcher opened. Each action therefore lists every form
# a Mac chord can arrive in: the GUI-app rewrite, the terminal rewrite, and the raw
# chord. XKB names: Mod4=Super, Mod1=Alt; Super and Mod3 (Hyper) are rejected, so
# Caps chords cannot be bound.
clipboard-paste=Mod4+v Control+v Control+Shift+v

cursor-home=Mod4+Left Control+a Home
cursor-end=Mod4+Right Control+e End
# Over a GUI app, Cmd+Backspace arrives as Shift+Home then BackSpace. There is no
# selection here, so Shift+Home does the delete and the BackSpace, now at the start
# of the input, does nothing.
delete-line-backward=Mod4+BackSpace Control+u Shift+Home
cursor-left-word=Mod1+Left Control+Left Mod1+b
cursor-right-word=Mod1+Right Control+Right Mod1+f
delete-prev-word=Mod1+BackSpace Control+BackSpace Control+w
