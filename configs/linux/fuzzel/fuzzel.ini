# fuzzel — application launcher and dmenu front-end. Replaces vicinae (Super+Space).
# man 5 fuzzel.ini. Only non-default values are set here.
#
# Colours come from the generated fragment; theme-apply writes it from the master
# palette. fuzzel exits non-zero and names the key on an unknown option.
include=~/.config/fuzzel/colors.ini

# Layer-shell namespace, so hyprland.lua's blur rule matches a name we chose rather
# than fuzzel's default. Must stay in sync with the fuzzel-blur layer rule.
namespace=fuzzel

font=CaskaydiaCove Nerd Font Mono:size=12
use-bold=yes
# Literal nerd-font glyph: U+F002 nf-fa-search. Restore from this comment if
# a tool ever strips it -- an empty prompt fails silently.
prompt="  "
placeholder=Search
terminal=ghostty -e
icon-theme=Adwaita

# Width is in CHARACTERS and lines in LINES, not pixels (~750x450 at this font size).
width=65
lines=15
vertical-pad=16
inner-pad=8

# Bare executables on $PATH too, so the fz-* dmenu wrappers in ~/.local/bin are
# launchable straight from Super+Space without .desktop files.
list-executables-in-path=yes
# .desktop Actions ("New Private Window") as their own entries.
show-actions=yes
# XDG_CURRENT_DESKTOP=Hyprland would otherwise hide apps declaring OnlyShowIn=GNOME.
filter-desktop=no

[border]
width=2
radius=12
# Round the selected row too, so it reads as a pill rather than a raw bar.
selection-radius=8

[dmenu]
# Exit rather than showing an empty window when a wrapper pipes in nothing.
exit-immediately-if-empty=yes

[key-bindings]
# fuzzel is layer-shell, so `hyprctl activewindow` never reports it and xremap
# cannot match on it -- the mac-style remaps simply do not apply inside the
# launcher. These are fuzzel's own bindings, which is the right layer to fix it.
#
# Modifier names are XKB: Mod4 = Super, Mod1 = Alt. "Super" and "Mod3" (Hyper)
# are both rejected outright, so Caps chords cannot be bound here at all.
#
# Paste lists three combos on purpose. Which one actually arrives depends on the
# window focused *before* the launcher opened, because that is what xremap sees:
#   from a GUI app  -> xremap rewrites Super+v to Control+v
#   from a terminal -> xremap rewrites Super+v to Control+Shift+v
#   neither matched -> the raw Mod4+v arrives
# Binding all three makes Super+V paste regardless of where you came from.
clipboard-paste=Mod4+v Control+v Control+Shift+v

cursor-home=Mod4+Left Control+a Home
cursor-end=Mod4+Right Control+e End
delete-line-backward=Mod4+BackSpace Control+u
cursor-left-word=Mod1+Left Control+Left Mod1+b
cursor-right-word=Mod1+Right Control+Right Mod1+f
delete-prev-word=Mod1+BackSpace Control+BackSpace Control+w
