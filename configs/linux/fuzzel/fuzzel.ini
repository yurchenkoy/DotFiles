# fuzzel — application launcher and dmenu front-end. Replaces vicinae (Super+Space).
# man 5 fuzzel.ini. Only non-default values are set here.
#
# Colours come from the generated fragment; theme-apply writes it from the master
# palette. fuzzel exits non-zero and names the key on an unknown option.
include=~/.config/fuzzel/colors.ini

# Layer-shell namespace, so hyprland.lua's blur rule matches a name we chose rather
# than fuzzel's default. Must stay in sync with the fuzzel-blur layer rule.
namespace=fuzzel

font=CaskaydiaCove Nerd Font Mono:size=12
use-bold=yes
# Literal nerd-font glyph: U+F002 nf-fa-search. Restore from this comment if
# a tool ever strips it -- an empty prompt fails silently.
prompt="  "
placeholder=Search
terminal=ghostty -e
icon-theme=Adwaita

# Width is in CHARACTERS and lines in LINES, not pixels (~750x450 at this font size).
width=65
lines=15
vertical-pad=16
inner-pad=8

# Bare executables on $PATH too, so the fz-* dmenu wrappers in ~/.local/bin are
# launchable straight from Super+Space without .desktop files.
list-executables-in-path=yes
# .desktop Actions ("New Private Window") as their own entries.
show-actions=yes
# XDG_CURRENT_DESKTOP=Hyprland would otherwise hide apps declaring OnlyShowIn=GNOME.
filter-desktop=no

[border]
width=2
radius=12
# Round the selected row too, so it reads as a pill rather than a raw bar.
selection-radius=8

[dmenu]
# Exit rather than showing an empty window when a wrapper pipes in nothing.
exit-immediately-if-empty=yes
